[project]
name = "speech-processing-lab-biu"
version = "0.2.0"
description = "Speech processing lab: ICBHI respiratory diagnostics and MMAR audio reasoning pipelines."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0.0",
    "librosa>=0.10.2",
    "loguru>=0.7.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    # Whisper and pyannote are needed by scripts/extract_acoustic_features.py (MMAR v18-v21). They are
    # regular dependencies so `uv run python scripts/...` finds them in the project environment.
    "openai-whisper>=20250625",
    "pandas>=2.2",
    "pyannote.audio>=4.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "sentence-transformers>=3.0",
    "soundfile>=0.12.1",
    "tabulate>=0.9.0",
    "torch>=2.4",
    "tqdm>=4.66",
    "transformers>=4.45",
    # vLLM has no macOS wheels, so the marker keeps `uv sync` working on a laptop while still
    # installing it on the Linux GPU host. Do NOT turn this into an optional extra: a missing
    # inference engine then only surfaces as a ModuleNotFoundError halfway through a run.
    "vllm>=0.10.0 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "assertpy>=1.1",
    "pytest>=8.3",
    "pytest-mock>=3.14",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/speech_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "PL", "RUF"]
ignore = ["E501", "PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLR0917"]
# vllm is not installable on macOS, so it is the one library imported inside functions.
"src/speech_processing/adapters/vllm.py" = ["PLC0415"]
"src/speech_processing/models/text.py" = ["PLC0415"]
