[project]
name = "speech_processing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "librosa>=1.0.0",
    "loguru>=0.7.3",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
    "vllm>=0.4.0; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "assertpy>=1.1",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.3",
]
